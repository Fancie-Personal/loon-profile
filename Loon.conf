[Proxy Group]
Proxy = select,Auto,HK,TW,SG,JP,KR,US,DIRECT,img-url = https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Proxy.png
Auto = fallback,ALL_Filter,interval = 600,max-timeout = 3000,img-url = https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Auto.png
HK = fallback,HK_Filter,interval = 600,max-timeout = 3000,img-url = https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Hong_Kong.png
TW = select,TW_Filter,img-url = https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Taiwan.png
SG = select,SG_Filter,img-url = https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Singapore.png
JP = select,JP_Filter,img-url = https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Japan.png
KR = select,KR_Filter,img-url = https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Korea.png
US = select,US_Filter,img-url = https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/United_States.png
YouTube = select,Proxy,Auto,HK,JP,US,img-url = https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/YouTube.png
Telegram = select,Proxy,Auto,SG,HK,US,img-url = https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Telegram.png
AI = select,US,Proxy,Auto,JP,img-url = https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Bot.png
Google = select,Proxy,Auto,US,HK,img-url = https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Google.png
Apple = select,DIRECT,Proxy,Auto,img-url = https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Apple.png
Microsoft = select,DIRECT,Proxy,Auto,img-url = https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Microsoft.png
