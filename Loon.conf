Final = select,Proxy,DIRECT,img-url = https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Final.png

[Remote Filter]
ALL_Filter = NameRegex, FilterKey = "(🇭🇰|🇯🇵|🇸🇬|🇺🇸|🇹🇼|🇰🇷|港|日|新|美|台|韩|HK|JP|SG|US|TW|KR)"
HK_Filter = NameRegex, FilterKey = "(?i)(🇭🇰|港|HK|Hong)"
TW_Filter = NameRegex, FilterKey = "(?i)(🇹🇼|台|TW|Tai)"
JP_Filter = NameRegex, FilterKey = "(?i)(🇯🇵|日本|东京|大阪|JP|Japan)"
KR_Filter = NameRegex, FilterKey = "(?i)(🇰🇷|KR|Korea|KOR|首尔|韩|韓)"
US_Filter = NameRegex, FilterKey = "(?i)(🇺🇸|美|US|United)"
SG_Filter = NameRegex, FilterKey = "(?i)(🇸🇬|新加坡|狮城|SG|Singapore)"

[Rule]
# Local overrides (higher than most remote lists when Loon places FINAL/GEOIP last)
PROCESS-NAME,Tailscale,DIRECT
PROCESS-NAME,IPNExtension,DIRECT
DOMAIN-SUFFIX,ts.net,DIRECT
IP-CIDR,100.64.0.0/10,DIRECT,no-resolve
GEOIP,cn,DIRECT
FINAL,Final

